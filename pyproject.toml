[project]
name = "birdwatcher"
version = "0.1.0"
description = "Watches course materials for consistency problems and blind spots"
readme = "README.md"
authors = [
    { name = "TheJoshuaEvans", email = "thejoshuaevans@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "codespell>=2.4.3",
    "platformdirs>=4.14.5",
    "pyspellchecker>=0.9.1",
    "rich>=15.0.0",
    "ruff>=0.17.4",
    "textual>=8.2.8",
    "truststore>=0.10.5",
]

[project.scripts]
birdwatcher = "birdwatcher:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package is ./birdwatcher, not ./src/birdwatcher
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff.lint]
# Mirrors the CS 212 PythonStyleAndBestPracticesChecklist.md (same rules as LCC-CS212)
extend-select = [
    "I",       # imports ordered: stdlib, third-party, local
    "N",       # snake_case / PascalCase / ALL_CAPS naming
    "ERA",     # commented-out code
    "PLR2004", # magic numbers instead of named constants
    "B",       # likely bugs
    "SIM",     # needlessly complex code
    "UP",      # modern Python syntax
]

[tool.ruff.lint.per-file-ignores]
# Expected values written out in a test are the point of the test, not magic numbers
"*_test.py" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["birdwatcher"]
python_files = ["*_test.py"]
